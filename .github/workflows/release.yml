# Tests and announces beacon-status/laravel to Packagist when a v* tag is pushed.
#
# Packagist reads composer.json from the repository root, so sdks/laravel must live in its
# own repository (split it with the monorepo's .github/workflows/split-packages.yml), and
# beacon-status/beacon-php must already be on Packagist (release it first). GitHub only runs
# workflows from the repository root, so this file is inert inside the monorepo.
#
# In the split repo, drop the "repositories" path entry from composer.json (../php won't exist;
# Composer then installs beacon-php from Packagist — the path repo is only used in the monorepo).
# Required secrets (not configured yet): PACKAGIST_USERNAME, PACKAGIST_TOKEN.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify Packagist
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}"
